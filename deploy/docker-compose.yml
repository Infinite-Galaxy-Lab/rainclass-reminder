services:
  rainclass-reminder:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: rainclass-reminder:latest
    container_name: rainclass-reminder
    restart: unless-stopped

    environment:
      TZ: Asia/Shanghai
      YKT_DATA_DIR: /app/data
      # 推荐用环境变量注入密钥，避免明文写在挂载的配置文件里。
      # YKT_FEISHU_WEBHOOK: "https://open.feishu.cn/open-apis/bot/v2/hook/xxx"
      # YKT_FEISHU_SECRET: "xxx"

    volumes:
      # 配置目录（含 config.yaml）
      - ./config:/app/config:ro
      # 运行数据：cookie 与 SQLite。登录需要写入 cookie.json，故可读写。
      - ./data:/app/data

    # 容器内的面板必须监听 0.0.0.0，映射到宿主机回环以保证安全。
    # 绑定 0.0.0.0 时程序要求配置 web_ui.token，否则拒绝启动。
    ports:
      - "127.0.0.1:8787:8787"

    deploy:
      resources:
        limits:
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
